<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gönderdiğim Teklifler</title>
  
  <!-- Teklifbul Rule v1.0 - Tema standardı: tb_theme key, FOUC önleme -->
  <script>
    (function() {
      const STORAGE_KEY = 'tb_theme';
      const root = document.documentElement;
      const saved = localStorage.getItem(STORAGE_KEY);
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const shouldBeDark = saved === 'dark' || (!saved && prefersDark);
      if (shouldBeDark) {
        root.classList.add('force-dark');
        root.setAttribute('data-theme', 'dark');
      } else {
        root.classList.remove('force-dark');
        root.removeAttribute('data-theme');
      }
    })();
  </script>
  
  <!-- Teklifbul Rule v1.0 - Ortak CSS dosyaları kullanılıyor -->
  <link rel="stylesheet" href="/css/ui-standard.css" />
  <style>
    /* Sayfaya özel stiller */
    body{font-family:system-ui,Arial;margin:0;color:#0f172a;background:#fff;}
    html[data-theme="dark"] body{background:#111827;color:#ffffff;}
    header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border,#e5e7eb);position:sticky;top:0;background:#fff;z-index:10}
    html[data-theme="dark"] header{background:#111827;border-bottom-color:rgba(255,255,255,0.25);}
    select,input{padding:10px;border:1px solid var(--border,#e5e7eb);border-radius:8px}
    html[data-theme="dark"] select,
    html[data-theme="dark"] input {
      border-color: rgba(255,255,255,0.25);
      background: #111827;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="bids-incoming.html" class="btn-link">← Gelen Teklifler</a>
    </nav>
    <div><strong>Gönderdiğim Teklifler</strong></div>
    <div></div>
  </header>
  <div class="container">
    <div class="filters">
      <select id="f-demand"><option value="">Tüm Talepler</option></select>
      <select id="f-mode">
        <option value="">Talep Tipi (Tümü)</option>
        <option value="secret">Gizli</option>
        <option value="open">Açık</option>
        <option value="hybrid">Hibrit</option>
      </select>
      <select id="f-status">
        <option value="">Durum (Tümü)</option>
        <option value="sent">Gönderildi</option>
        <option value="responded">Yanıtlandı</option>
        <option value="accepted">Kabul</option>
        <option value="rejected">Red</option>
        <option value="completed">Tamamlandı</option>
      </select>
      <input id="f-buyer" placeholder="Alıcı firma ara..." />
    </div>

    <table>
      <thead>
        <tr>
          <th>Talep</th>
          <th>Alıcı Firma</th>
          <th>Fiyat</th>
          <th>Termin</th>
          <th>Marka</th>
          <th>Ödeme</th>
          <th>Durum</th>
          <th>Tip</th>
          <th>Tarih</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty hidden">Gönderdiğiniz teklif yok.</div>
  </div>

  <script type="module">
    // Teklifbul Rule v1.0 - XSS Protection
    import DOMPurify from 'https://cdn.jsdelivr.net/npm/dompurify@3.2.2/+esm';
    import { auth, db } from './firebase.js';
    import {
      collection, query, where, getDocs, getDoc, doc, orderBy, limit
    } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js';
    import { getStatusLabel, getPaymentMethodLabel } from './bid-management.js';
    import { toast } from '/src/shared/ui/toast.js';
    import { MESSAGES } from '/src/shared/constants/messages.js';
    import { logger } from '/src/shared/log/logger.js';
    import { requireCompanyContext } from './assets/js/state/company-context.js';
    import { initPermissions, can, getBidPerms } from './assets/js/state/permissions.js';

    const $ = (s)=>document.querySelector(s);
    const fmt = (n)=> typeof n==='number' ? new Intl.NumberFormat('tr-TR').format(n) : '—';
    const fmtDate = (ts)=>{ try{ const d = ts?.toDate ? ts.toDate() : (ts? new Date(ts): null); return d? d.toLocaleDateString('tr-TR'): '—'; }catch{return '—'} };
    const badge=(mode)=>{
      const m=(mode||'').toLowerCase();
      if(m==='open') return '<span class="badge b-open">Açık</span>';
      if(m==='hybrid') return '<span class="badge b-hybrid">Hibrit</span>';
      return '<span class="badge b-secret">Gizli</span>';
    };

    const CACHE_DEMANDS=new Map();
    async function preloadDemandsForSupplier(user){
      // Get unique demandIds from my bids to fill demand filter quickly
      const q=query(collection(db,'bids'), where('supplierId','==', user.uid), orderBy('createdAt','desc'), limit(200));
      const snap=await getDocs(q);
      const demandIds=[...new Set(snap.docs.map(d=>d.data().demandId))];
      const sel=$('#f-demand');
      for(const id of demandIds){
        const ds=await getDoc(doc(db,'demands', id));
        if(ds.exists()){
          const data=ds.data(); CACHE_DEMANDS.set(id,{id, ...data});
          const opt=document.createElement('option'); opt.value=id; opt.textContent=data.title||id; sel.appendChild(opt);
        }
      }
    }
    async function joinBuyerCompanyName(demand){
      try{
        const u = await getDoc(doc(db,'users', demand.createdBy));
        return u.exists()? (u.data().companyName || '—') : '—';
      }catch{return '—'}
    }
    function matchesFilters(r){
      const demandFilter=$('#f-demand').value;
      const modeFilter=$('#f-mode').value;
      const statusFilter=$('#f-status').value;
      const buyerSearch=$('#f-buyer').value.trim().toLowerCase();
      if(demandFilter && r.demandId!==demandFilter) return false;
      if(modeFilter && (r.biddingMode||'')!==modeFilter) return false;
      if(statusFilter && (r.status||'')!==statusFilter) return false;
      if(buyerSearch && !(r.buyerCompanyName||'').toLowerCase().includes(buyerSearch)) return false;
      return true;
    }
    function render(rows){
      const body=$('#rows'); body.innerHTML='';
      const filtered=rows.filter(matchesFilters);
      if(filtered.length===0){ $('#empty').classList.remove('hidden'); return } else { $('#empty').classList.add('hidden'); }
      filtered.forEach(r=>{
        const tr=document.createElement('tr');
        // Teklifbul Rule v1.0 - XSS Protection
        const safeDemandTitle = DOMPurify.sanitize(r.demandTitle||r.demandId||'', { ALLOWED_TAGS: [] });
        const safeBuyerCompanyName = DOMPurify.sanitize(r.buyerCompanyName||'—', { ALLOWED_TAGS: [] });
        const safeBrand = DOMPurify.sanitize(r.brand||'—', { ALLOWED_TAGS: [] });
        const safePaymentMethod = DOMPurify.sanitize(getPaymentMethodLabel(r.paymentMethod||'unknown')||'', { ALLOWED_TAGS: [] });
        const safeStatus = DOMPurify.sanitize(getStatusLabel(r.status||'pending')||'', { ALLOWED_TAGS: [] });
        const safeBadge = DOMPurify.sanitize(badge(r.biddingMode)||'', {
          ALLOWED_TAGS: ['span'],
          ALLOWED_ATTR: ['class']
        });
        const safeDemandId = DOMPurify.sanitize(r.demandId||'', { ALLOWED_TAGS: [] });
        tr.innerHTML = DOMPurify.sanitize(`
          <td>${safeDemandTitle}</td>
          <td>${safeBuyerCompanyName}</td>
          <td>₺ ${fmt(r.netPrice ?? r.price)}</td>
          <td>${r.leadTimeDays ?? '—'}</td>
          <td>${safeBrand}</td>
          <td>${safePaymentMethod}</td>
          <td>${safeStatus}</td>
          <td>${safeBadge}</td>
          <td>${fmtDate(r.createdAt)}</td>
          <td><button class="btn-link" data-demand="${safeDemandId}">Görüntüle →</button></td>`, {
          ALLOWED_TAGS: ['td', 'button', 'span'],
          ALLOWED_ATTR: ['class', 'data-demand']
        });
        body.appendChild(tr);
      });
      body.querySelectorAll('button[data-demand]').forEach(b=>{
        b.addEventListener('click', (e)=>{
          const id=e.currentTarget.dataset.demand;
          window.location.href=`demand-detail.html?id=${encodeURIComponent(id)}#bids`;
        });
      });
    }

    const BID_PERMS = getBidPerms();

    async function loadOutgoing(user){
      // Permission guard - Teklifleri görüntüleme yetkisi yoksa sorgu çalıştırma
      if (BID_PERMS.view && !can(BID_PERMS.view)) {
        const msg =
          MESSAGES.ERROR_PERMISSION_BIDS_VIEW ||
          MESSAGES.ERROR_PERMISSION_DENIED ||
          'Teklifleri görüntüleme yetkiniz yok.';
        toast.error(msg);
        logger.warn('bids-outgoing: view yetkisi yok, loadOutgoing iptal edildi', {
          permKey: BID_PERMS.view,
          uid: user.uid
        });
        return [];
      }
      const q=query(collection(db,'bids'), where('supplierId','==', user.uid), orderBy('createdAt','desc'), limit(200));
      const snap=await getDocs(q);
      const rows=[];
      for(const b of snap.docs){
        const data={id:b.id, ...b.data()};
        const dSnap=await getDoc(doc(db,'demands', data.demandId));
        if(dSnap.exists()){
          const dem={id:dSnap.id, ...dSnap.data()}; CACHE_DEMANDS.set(dem.id, dem);
          data.demandTitle=dem.title; data.biddingMode=dem.biddingMode || 'secret';
          data.buyerCompanyName=await joinBuyerCompanyName(dem);
        }
        rows.push(data);
      }
      return rows;
    }

    async function init(){
      const user=auth.currentUser;

      // Company context + permissions (URL guard)
      try {
        const ctx = await requireCompanyContext({ redirectOnPending: true });
        if (!ctx || !ctx.companyId) {
          logger.warn('bids-outgoing: company context alınamadı, sayfa başlatılmıyor', { ctx });
          toast.error(
            (MESSAGES.ERROR_COMPANY_ID_REQUIRED || 'Şirket bilgisi doğrulanamadı') +
              '. Teklifler ekranı yüklenemedi.'
          );
          return;
        }

        const permState = await initPermissions({ redirectOnPending: true });
        if (!permState) {
          logger.warn('bids-outgoing: initPermissions sonuç vermedi, sayfa başlatılmıyor');
          return;
        }

        if (BID_PERMS.view && !can(BID_PERMS.view)) {
          const msg =
            MESSAGES.ERROR_PERMISSION_BIDS_VIEW ||
            MESSAGES.ERROR_PERMISSION_DENIED ||
            'Teklifleri görüntüleme yetkiniz yok.';
          toast.error(msg);
          logger.warn('bids-outgoing: view yetkisi yok, URL guard tetiklendi', {
            permKey: BID_PERMS.view,
            companyId: permState.companyId,
            roleKey: permState.roleKey,
            uid: user.uid
          });
          window.location.href = './demands.html';
          return;
        }

        await preloadDemandsForSupplier(user);
        const data=await loadOutgoing(user);
        render(data);
        ['#f-demand','#f-mode','#f-status','#f-buyer'].forEach(sel=> $(sel).addEventListener('input', ()=> render(data)));
      } catch (error) {
        logger.error('bids-outgoing init error', error);
        toast.error(
          (MESSAGES.ERROR_LOADING_OUTGOING_BIDS || 'Gönderdiğiniz teklifler yüklenirken hata oluştu') +
            ': ' +
            (error.message || error)
        );
      }
    }

    // Teklifbul Rule v1.0 - Memory Leak Prevention: Listener cleanup
    const authUnsubscribe = onAuthStateChanged(auth, (u) => {
      if (!u) {
        window.location.href = 'login.html';
      } else {
        init();
      }
    });
    
    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (authUnsubscribe) authUnsubscribe();
    });
  </script>
</body>
</html>
