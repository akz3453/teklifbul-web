<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Talep Listesi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Teklifbul Rule v1.0 - FOUC önleme: Tema hemen uygulanmalı -->
  <script src="/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/utils.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <style>
    body{font-family:system-ui, Arial; background:#f8fafc; color:#111827; margin:0}
    .container{max-width:1200px;margin:0 auto;padding:20px}
    h1{margin:0 0 8px 0}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:16px;margin:12px 0}
    table{width:100%;border-collapse:collapse; margin-top:12px}
    th,td{border-bottom:1px solid #e5e7eb;padding:12px;text-align:left;font-size:13px}
    th{background:#f9fafb;font-weight:600}
    .badge{display:inline-block;border-radius:14px;padding:4px 8px;font-size:12px;font-weight:600}
    .b-draft{background:#f3f4f6;color:#374151}
    .b-sent{background:#dbeafe;color:#1e40af}
    .b-approved{background:#dcfce7;color:#065f46}
    .b-rejected{background:#fee2e2;color:#991b1b}
    .muted{color:#6b7280;font-size:12px}
    .btn{padding:8px 16px;border:0;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;text-decoration:none;display:inline-block}
    .btn-primary{background:#2563eb;color:#fff}
    .btn-secondary{background:#6b7280;color:#fff}
    .btn-success{background:#10b981;color:#fff;padding:6px 12px;font-size:12px}
    .btn-danger{background:#ef4444;color:#fff;padding:6px 12px;font-size:12px}
    .btn:hover{opacity:0.9}
    .btn-group{display:flex;gap:4px}
    .btn-group .btn{margin:0}
    
    /* Koyu Mod Düzenlemeleri */
    html[data-theme="dark"] body,
    html.force-dark body {
      background:#111827;
      color:#ffffff;
    }
    html[data-theme="dark"] .card,
    html.force-dark .card {
      background:#111827;
      border:1px solid rgba(255,255,255,0.1);
      color:#ffffff;
    }
    html[data-theme="dark"] table,
    html.force-dark table {
      background:#111827;
    }
    html[data-theme="dark"] th,
    html.force-dark th {
      background:#111827;
      color:#ffffff;
      border-bottom:1px solid rgba(255,255,255,0.1);
    }
    html[data-theme="dark"] td,
    html.force-dark td {
      color:#ffffff;
      border-bottom:1px solid rgba(255,255,255,0.1);
    }
    html[data-theme="dark"] .muted,
    html.force-dark .muted {
      color:#9ca3af;
    }
    html[data-theme="dark"] h1,
    html.force-dark h1 {
      color:#ffffff;
    }
  </style>
</head>
<body>
  <!-- Common Header -->
  <header id="app-header"></header>

  <div class="container">
    <!-- Breadcrumb Navigation -->
    <div class="tb-breadcrumb" id="breadcrumb">
      <span class="tb-crumb">
        <span class="ico">🏠</span>
        <a href="/dashboard.html">Ana Sayfa</a>
      </span>
      <span class="tb-sep">›</span>
      <span class="tb-crumb">
        <span class="ico">📦</span>
        <a href="/inventory-index.html">Stok Takip</a>
      </span>
      <span class="tb-sep">›</span>
      <span class="tb-crumb">
        <span class="ico">📄</span>
        <span>Talep Listesi</span>
      </span>
    </div>
    
    <h1>Talep Listesi (İşlem Merkezi)</h1>
    <p class="muted">Oluşturulan tüm transfer taleplerini yanıtlayın, düzenleyin veya yönetin.</p>

    <div class="card">
      <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px">
          <input id="searchInput" type="text" placeholder="Başlık, talep eden veya şantiye ara..." style="width:100%;padding:8px 12px;border:1px solid #e5e7eb;border-radius:6px;font-size:14px" />
        </div>
        <div>
          <select id="filterStatus" style="padding:8px 12px;border:1px solid #e5e7eb;border-radius:6px;font-size:14px">
            <option value="">Tüm Durumlar</option>
            <option value="DRAFT">Taslak</option>
            <option value="SENT">Gönderildi</option>
            <option value="APPROVED">Onaylandı</option>
            <option value="REJECTED">Reddedildi</option>
          </select>
        </div>
        <div>
          <select id="filterType" style="padding:8px 12px;border:1px solid #e5e7eb;border-radius:6px;font-size:14px">
            <option value="">Tüm Tipler</option>
            <option value="ŞMTF">ŞMTF</option>
            <option value="IMTF">IMTF</option>
            <option value="DMTF">DMTF</option>
          </select>
        </div>
      </div>

      <div style="display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap">
        <div style="padding:12px;background:#f9fafb;border-radius:6px;flex:1;min-width:120px">
          <div style="font-size:12px;color:#6b7280;margin-bottom:4px">Toplam</div>
          <div id="statTotal" style="font-size:20px;font-weight:600">0</div>
        </div>
        <div style="padding:12px;background:#f9fafb;border-radius:6px;flex:1;min-width:120px">
          <div style="font-size:12px;color:#6b7280;margin-bottom:4px">Gösterilen</div>
          <div id="statShown" style="font-size:20px;font-weight:600">0</div>
        </div>
        <div style="padding:12px;background:#dbeafe;border-radius:6px;flex:1;min-width:120px">
          <div style="font-size:12px;color:#1e40af;margin-bottom:4px">Gönderildi</div>
          <div id="statSent" style="font-size:20px;font-weight:600;color:#1e40af">0</div>
        </div>
        <div style="padding:12px;background:#dcfce7;border-radius:6px;flex:1;min-width:120px">
          <div style="font-size:12px;color:#065f46;margin-bottom:4px">Onaylandı</div>
          <div id="statApproved" style="font-size:20px;font-weight:600;color:#065f46">0</div>
        </div>
      </div>

      <h2 style="margin:0 0 12px 0;font-size:18px">Talepler</h2>
      <table id="requestsTable">
        <thead>
          <tr>
            <th>Başlık</th>
            <th>Tip</th>
            <th>Talep Eden</th>
            <th>Şantiye/Lokasyon</th>
            <th>Durum</th>
            <th>Oluşturulma</th>
            <th>İşlemler</th>
          </tr>
        </thead>
        <tbody id="requestsBody">
          <tr>
            <td colspan="7" style="text-align:center;padding:40px;color:#6b7280">Yükleniyor...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Firebase -->
  <script type="module" src="/firebase.js"></script>
  <!-- Header -->
  <script type="module">
    import { initAuthGuard } from '/assets/js/auth-guard.js';
    import { initGlobalHeader } from '../assets/js/ui/header.js';
    initAuthGuard().catch((err) => { console.error('Auth guard init failed', err); });

    initGlobalHeader({ mount: '#app-header', activeRoute: 'inventory' });
  </script>
  <!-- Main -->
  <script type="module">
    // Teklifbul Rule v1.0 - Talep Listesi İyileştirmeleri
    // Teklifbul Rule v1.0 - XSS Protection
    import DOMPurify from 'https://cdn.jsdelivr.net/npm/dompurify@3.2.2/+esm';
    import { db, requireAuth } from '/firebase.js';
    import { collection, getDocs, query, where, limit } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js';
    import { toast } from '/src/shared/ui/toast.js';
    import { MESSAGES } from '/src/shared/constants/messages.js';
    import { logger } from '/src/shared/log/logger.js';
    import { requireCompanyContext } from '/assets/js/state/company-context.js';
    import { setTableEmpty } from '/assets/js/utils/safe-table.js';
    import { authFetch } from '/assets/js/utils/api-helpers.js';

    const qs = s => document.querySelector(s);

    const state = {
      allRequests: [],
      filteredRequests: [],
      searchQuery: '',
      filterStatus: '',
      filterType: '',
      companyId: null,
      user: null
    };

    function requestCreatedAtMs(req) {
      const raw = req?.createdAt;
      if (!raw) return 0;
      if (typeof raw.toMillis === 'function') return raw.toMillis();
      if (typeof raw.seconds === 'number') return raw.seconds * 1000;
      const t = new Date(raw).getTime();
      return Number.isFinite(t) ? t : 0;
    }

    async function loadRequests() {
      logger.group('Talep Listesi Yükleme');
      try {
        state.user = await requireAuth();
        logger.info('Kullanıcı doğrulandı', { uid: state.user.uid });

        // Teklifbul Rule v1.0 - company context (activeCompanyId / join status)
        const companyContext = await requireCompanyContext({ redirectOnPending: true });
        state.companyId = companyContext?.companyId || null;

        if (!state.companyId) {
          logger.error('Şirket bilgisi bulunamadı');
          // Teklifbul Rule v1.0 — DOMPurify <tr>/<td>'yi table dışında siler; createElement kullan
          setTableEmpty(qs('#requestsBody'), 7, 'Şirket bilgisi bulunamadı.');
          toast.error(MESSAGES.ERROR_REQUEST_COMPANY_INFO_NOT_FOUND);
          logger.end();
          return;
        }

        logger.info('Şirket bilgisi alındı', { companyId: state.companyId });

        // Teklifbul Rule v1.0 — companyId filtreli sorgu zorunlu (kuralsız full scan → permission-denied)
        const byCompanyQ = query(
          collection(db, 'internal_requests'),
          where('companyId', '==', state.companyId),
          limit(10000)
        );
        const byCreatorQ = query(
          collection(db, 'internal_requests'),
          where('createdBy', '==', state.user.uid),
          limit(1000)
        );
        const byRequesterQ = query(
          collection(db, 'internal_requests'),
          where('requesterUserId', '==', state.user.uid),
          limit(1000)
        );

        const [companySnap, creatorSnap, requesterSnap] = await Promise.all([
          getDocs(byCompanyQ),
          getDocs(byCreatorQ).catch((err) => {
            logger.warn('createdBy talep sorgusu atlandı', err);
            return { docs: [] };
          }),
          getDocs(byRequesterQ).catch((err) => {
            logger.warn('requesterUserId talep sorgusu atlandı', err);
            return { docs: [] };
          })
        ]);

        const byId = new Map();
        for (const snap of [companySnap, creatorSnap, requesterSnap]) {
          snap.docs.forEach((d) => {
            if (!byId.has(d.id)) byId.set(d.id, { id: d.id, ...d.data() });
          });
        }

        state.allRequests = Array.from(byId.values()).sort(
          (a, b) => requestCreatedAtMs(b) - requestCreatedAtMs(a)
        );

        logger.info('Talepler yüklendi', { count: state.allRequests.length });
        applyFilters();
        logger.end();
        
      } catch (error) {
        logger.error('Talep yükleme hatası', error);
        // Teklifbul Rule v1.0 — DOMPurify <tr>/<td>'yi table dışında siler; createElement kullan
        setTableEmpty(qs('#requestsBody'), 7, `Yükleme hatası: ${error.message || 'Bilinmeyen hata'}`);
        if (error?.code === 'permission-denied' || /insufficient permissions/i.test(String(error?.message || ''))) {
          toast.error('Talep okuma izni yok. Üyelik durumunuzu kontrol edin veya sayfayı yenileyin.');
        } else {
          toast.error(MESSAGES.ERROR_REQUEST_LOAD.replace('{message}', error.message));
        }
        logger.end();
      }
    }

    function applyFilters() {
      logger.group('Talep Filtreleme');
      
      let filtered = [...state.allRequests];
      
      // Arama filtresi
      if (state.searchQuery.trim()) {
        const query = state.searchQuery.toLowerCase();
        filtered = filtered.filter(req => {
          const title = (req.title || '').toLowerCase();
          const requester = (req.requesterName || '').toLowerCase();
          const site = ((req.siteName || req.locationName) || '').toLowerCase();
          return title.includes(query) || requester.includes(query) || site.includes(query);
        });
        logger.info('Arama filtresi uygulandı', { query: state.searchQuery, count: filtered.length });
      }
      
      // Durum filtresi
      if (state.filterStatus) {
        filtered = filtered.filter(req => req.status === state.filterStatus);
        logger.info('Durum filtresi uygulandı', { status: state.filterStatus, count: filtered.length });
      }
      
      // Tip filtresi
      if (state.filterType) {
        filtered = filtered.filter(req => (req.type || 'ŞMTF') === state.filterType);
        logger.info('Tip filtresi uygulandı', { type: state.filterType, count: filtered.length });
      }
      
      state.filteredRequests = filtered;
      renderRequests(filtered);
      updateStats();
      logger.end();
    }

    function updateStats() {
      const total = state.allRequests.length;
      const shown = state.filteredRequests.length;
      const sent = state.allRequests.filter(r => r.status === 'SENT').length;
      const approved = state.allRequests.filter(r => r.status === 'APPROVED').length;
      
      qs('#statTotal').textContent = total;
      qs('#statShown').textContent = shown;
      qs('#statSent').textContent = sent;
      qs('#statApproved').textContent = approved;
    }

    function renderRequests(requests) {
      const tbody = qs('#requestsBody');
      tbody.textContent = '';

      if (requests.length === 0) {
        // Teklifbul Rule v1.0 — DOMPurify <tr>/<td>'yi table dışında siler; createElement kullan
        setTableEmpty(tbody, 7, 'Henüz talep bulunamadı.');
        return;
      }

      requests.forEach((req) => {
        const tr = document.createElement('tr');
        const date = req.createdAt ? new Date(req.createdAt.toDate()).toLocaleDateString('tr-TR') : '-';
        const typeText = req.type || 'ŞMTF';
        const canApprove = req.status === 'SENT';
        const requestId = String(req.id || '');

        const titleTd = document.createElement('td');
        const strong = document.createElement('strong');
        strong.textContent = req.title || '-';
        titleTd.appendChild(strong);
        tr.appendChild(titleTd);

        const typeTd = document.createElement('td');
        typeTd.textContent = typeText;
        tr.appendChild(typeTd);

        const requesterTd = document.createElement('td');
        requesterTd.textContent = req.requesterName || '-';
        tr.appendChild(requesterTd);

        const siteTd = document.createElement('td');
        siteTd.textContent = req.siteName || req.locationName || '-';
        tr.appendChild(siteTd);

        const statusTd = document.createElement('td');
        statusTd.appendChild(createStatusBadge(req.status));
        tr.appendChild(statusTd);

        const dateTd = document.createElement('td');
        dateTd.textContent = date;
        tr.appendChild(dateTd);

        const actionsTd = document.createElement('td');
        const group = document.createElement('div');
        group.className = 'btn-group';

        const detailLink = document.createElement('a');
        detailLink.href = `/pages/request-detail.html?id=${encodeURIComponent(requestId)}`;
        detailLink.className = 'btn btn-primary';
        detailLink.textContent = 'Detay';
        detailLink.setAttribute('aria-label', 'Talep detayı');
        group.appendChild(detailLink);

        if (canApprove) {
          const approveBtn = document.createElement('button');
          approveBtn.type = 'button';
          approveBtn.className = 'btn btn-success';
          approveBtn.textContent = '✓';
          approveBtn.title = 'Onayla';
          approveBtn.setAttribute('aria-label', 'Talebi onayla');
          approveBtn.addEventListener('click', () => window.handleApprove(requestId));
          group.appendChild(approveBtn);

          const rejectBtn = document.createElement('button');
          rejectBtn.type = 'button';
          rejectBtn.className = 'btn btn-danger';
          rejectBtn.textContent = '✗';
          rejectBtn.title = 'Reddet';
          rejectBtn.setAttribute('aria-label', 'Talebi reddet');
          rejectBtn.addEventListener('click', () => window.handleReject(requestId));
          group.appendChild(rejectBtn);
        }

        actionsTd.appendChild(group);
        tr.appendChild(actionsTd);
        tbody.appendChild(tr);
      });
    }

    // Global functions for onclick handlers
    window.handleApprove = async function(requestId) {
      logger.group('Talep Onay İşlemi');
      
      if (!confirm('Bu talep onaylanacak. Detay sayfasına yönlendirileceksiniz. Devam edilsin mi?')) {
        logger.info('Onay işlemi iptal edildi');
        logger.end();
        return;
      }
      
      try {
        logger.info('Talep onaylanıyor', { requestId });
        toast.info(MESSAGES.INFO_REQUEST_APPROVING);
        
        // Detay sayfasına yönlendir (orada tam onay işlemi yapılacak)
        window.location.href = `/pages/request-detail.html?id=${requestId}`;
        
      } catch (error) {
        logger.error('Onay işlemi hatası', error);
        toast.error(MESSAGES.ERROR_REQUEST_APPROVE.replace('{message}', error.message));
        logger.end();
      }
    };

    window.handleReject = async function(requestId) {
      logger.group('Talep Red İşlemi');
      
      const reason = prompt('Red sebebi:');
      if (!reason || !reason.trim()) {
        logger.info('Red işlemi iptal edildi (sebep girilmedi)');
        logger.end();
        return;
      }
      
      try {
        logger.info('Talep reddediliyor', { requestId, reason });
        toast.info(MESSAGES.INFO_REQUEST_REJECTING);
        const res = await authFetch(`/api/internal-requests/${encodeURIComponent(requestId)}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'REJECTED', rejectionReason: reason.trim() }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || MESSAGES.ERROR_OPERATION_FAILED);
        }
        
        logger.info('Talep başarıyla reddedildi', { requestId });
        toast.success(MESSAGES.SUCCESS_REQUEST_REJECTED);
        
        // Listeyi yenile
        await loadRequests();
        logger.end();
        
      } catch (error) {
        logger.error('Red işlemi hatası', error);
        toast.error(MESSAGES.ERROR_REQUEST_REJECT.replace('{message}', error.message));
        logger.end();
      }
    };

    function createStatusBadge(status) {
      const span = document.createElement('span');
      const map = {
        DRAFT: { cls: 'b-draft', text: 'Taslak' },
        SENT: { cls: 'b-sent', text: 'Gönderildi' },
        APPROVED: { cls: 'b-approved', text: 'Onaylandı' },
        REJECTED: { cls: 'b-rejected', text: 'Reddedildi' },
      };
      const info = map[status] || { cls: 'b-draft', text: status || '-' };
      span.className = `badge ${info.cls}`;
      span.textContent = info.text;
      return span;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Event listeners
    async function setupEventListeners() {
      // Teklifbul Rule v1.0 - Debounce utility import
      const { debounce } = await import('/assets/js/utils/debounce.js');
      
      // Debounced search (Teklifbul Rule v1.0)
      const debouncedSearch = debounce((query) => {
        state.searchQuery = query.trim();
        applyFilters();
      }, 300);
      
      qs('#searchInput').addEventListener('input', (e) => {
        debouncedSearch(e.target.value);
      });
      
      qs('#filterStatus').addEventListener('change', (e) => {
        state.filterStatus = e.target.value;
        applyFilters();
      });
      
      qs('#filterType').addEventListener('change', (e) => {
        state.filterType = e.target.value;
        applyFilters();
      });
    }

    // Initialize
    (async () => {
      await loadRequests();
      setupEventListeners();
    })();
  </script>
</body>
</html>
