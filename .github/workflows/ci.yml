name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify:
    name: Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm run type-check
      - run: npm run lint:ci
      - run: npm run test:run
      - run: npm run test:rules
      - run: npm run build:api
      - run: npm run build

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Start API server
        run: |
          npm run api &
          sleep 10
        env:
          API_PORT: 5174
          NODE_ENV: test
      - name: Health Check
        run: |
          HEALTH_URL=${HEALTH_CHECK_URL:-http://localhost:5174/health}
          response=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL || echo "000")
          if [ "$response" != "200" ]; then
            echo "❌ Health check failed: HTTP $response"
            exit 1
          fi
          api_response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5174/api/health || echo "000")
          if [ "$api_response" != "200" ]; then
            echo "❌ /api/health failed: HTTP $api_response"
            exit 1
          fi
          echo "✅ Health check passed"
        env:
          HEALTH_CHECK_URL: http://localhost:5174/health

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run Smoke Test
        run: npm run smoke
        env:
          NODE_ENV: test
