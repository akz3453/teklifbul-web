<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Terminal - FEFO / SKT Engine</title>
  <style>
    :root {
      --bg-dark: #121826;
      --bg-card: #1f2937;
      --accent: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --border: #374151;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .pos-container {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
    }
    h2 {
      margin-top: 0;
      text-align: center;
      font-weight: 600;
      margin-bottom: 2rem;
    }
    .input-group {
      margin-bottom: 1.5rem;
    }
    .input-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
    .input-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .input-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }
    .btn-submit {
      width: 100%;
      padding: 0.875rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 1rem;
    }
    .btn-submit:hover { background: #2563eb; }
    
    .status-panel {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 6px;
      display: none;
      text-align: center;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .status-success { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid var(--success); display: block; }
    .status-warning { background: rgba(245, 158, 11, 0.1); color: var(--warning); border: 1px solid var(--warning); display: block; }
    .status-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); display: block; }

  </style>
</head>
<body>
  <div class="pos-container">
    <h2>Scanner Terminal</h2>
    <form id="posForm">
      <div class="input-group">
        <label for="barcode">Barkod Okuyucu (Master veya SKT-Alias)</label>
        <input type="text" id="barcode" placeholder="Ã–rn: 869... veya SKT-1452-2026..." required autofocus autocomplete="off">
      </div>
      <div class="input-group">
        <label for="qty">Miktar</label>
        <input type="number" id="qty" value="1" min="1" step="0.01" required>
      </div>
      <button type="submit" class="btn-submit">SatÄ±ÅŸ GerÃ§ekleÅŸtir (FEFO AlgoritmasÄ±)</button>
    </form>
    <div id="statusPanel" class="status-panel"></div>
  </div>

  <script src="/js/fefo-pos.js"></script>
</body>
</html>
