<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bağlantı yok — NEFISOFT</title>
  <style>
    :root {
      --primary: #2563EB;
      --text: #111827;
      --muted: #6B7280;
      --bg: #F8FAFC;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Roboto, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    }
    .card {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .brand {
      margin: 0 0 28px;
    }
    .brand img {
      display: block;
      width: min(180px, 55vw);
      height: auto;
      margin: 0 auto;
      object-fit: contain;
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #DBEAFE;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 10px;
      font-weight: 700;
    }
    p {
      margin: 0 0 28px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.95rem;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 600;
      font-size: 1rem;
      padding: 14px 24px;
      width: 100%;
      cursor: pointer;
    }
    button:active { opacity: 0.9; }
    .hint {
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card" role="alert" aria-live="polite">
    <p class="brand">
      <img src="./assets/images/brand/nefisoft-web-stacked.png" alt="NEFISOFT" width="180" height="180" onerror="this.style.display='none'" />
    </p>
    <div class="icon" aria-hidden="true">📡</div>
    <h1>İnternet bağlantısı yok</h1>
    <p>Uygulama çalışmak için internet gerektirir. Bağlantınızı kontrol edip tekrar deneyin.</p>
    <button type="button" id="retryBtn" aria-label="Tekrar dene">Tekrar Dene</button>
    <p class="hint" id="statusHint"></p>
  </div>
  <script>
    (function () {
      var LIVE = 'https://teklifbul.web.app/login.html';
      var btn = document.getElementById('retryBtn');
      var hint = document.getElementById('statusHint');

      function goLive() {
        hint.textContent = 'Bağlanıyor...';
        btn.disabled = true;
        window.location.replace(LIVE);
      }

      btn.addEventListener('click', goLive);

      window.addEventListener('online', function () {
        hint.textContent = 'Bağlantı geldi. Tekrar deneyebilirsiniz.';
        btn.disabled = false;
      });

      window.addEventListener('offline', function () {
        hint.textContent = '';
        btn.disabled = false;
      });
    })();
  </script>
</body>
</html>
